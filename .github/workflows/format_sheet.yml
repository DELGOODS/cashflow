name: Apply Sheet Formatting

# Eenmalig (of na sheet-aanpassingen) handmatig draaien om visuele opmaak toe te passen.
# Headers bold, gele cellen voor bewerkbare velden, euro-format, conditional colors op status.

on:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply formatting
        env:
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CASHFLOW_SHEET_ID: ${{ secrets.CASHFLOW_SHEET_ID }}
        run: python -m src.format_sheets
